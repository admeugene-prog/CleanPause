name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Select installer version
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw 'Release tag must have the format v1.2.3.'
            }
            $version = $Matches[1]
          }
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test, vet, and build application
        run: ./build.ps1
      - name: Build unsigned installer
        run: ./build-installer.ps1 -SkipAppBuild -Unsigned -Version $env:BUILD_VERSION
      - name: Build unsigned MSIX
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $options = @{}
          if ($env:STORE_IDENTITY_NAME) { $options.IdentityName = $env:STORE_IDENTITY_NAME }
          if ($env:STORE_PUBLISHER) { $options.Publisher = $env:STORE_PUBLISHER }
          if ($env:STORE_PUBLISHER_DISPLAY_NAME) { $options.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME }
          ./build-msix.ps1 -SkipAppBuild -Version $env:BUILD_VERSION @options
      - name: Create SHA256 checksums
        run: |
          $lines = @('dist/CleanPause.exe', 'dist/CleanPause-Setup.exe', 'dist/CleanPause.msix') | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), (Split-Path $_ -Leaf)
          }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: CleanPause-windows-x64
          path: |
            dist/CleanPause.exe
            dist/CleanPause-Setup.exe
            dist/CleanPause.msix
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: CleanPause-windows-x64
          path: dist
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $sourceUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
          $notes = @(
            '## English',
            '',
            'Windows x64 application and per-user installer. All attached files were built and uploaded by GitHub Actions from the tagged source; no locally built binaries were uploaded.',
            '',
            "Build log: $runUrl",
            "Source commit: $sourceUrl",
            '',
            'Download CleanPause-Setup.exe to install, or CleanPause.exe for the standalone application. SHA256SUMS.txt contains checksums; compare them with Get-FileHash -Algorithm SHA256 in PowerShell.',
            '',
            'These binaries are unsigned. A successful Actions build does not guarantee antivirus acceptance.',
            'CleanPause.msix is an unsigned preview package. It requires the Partner Center identity before Store submission, approval of allowElevation, and testing of elevation, input recovery, and startup. It is not a Microsoft Store certified release and cannot be installed normally by double-clicking while unsigned.',
            '',
            '## Русский',
            '',
            'Приложение Windows x64 и установщик для текущего пользователя. Все приложенные файлы собраны и опубликованы GitHub Actions из исходников тега; локальные сборки не загружались.',
            '',
            "Журнал сборки: $runUrl",
            "Исходный коммит: $sourceUrl",
            '',
            'Для установки скачайте CleanPause-Setup.exe; для отдельного запуска — CleanPause.exe. Контрольные суммы находятся в SHA256SUMS.txt; проверить файл можно командой Get-FileHash -Algorithm SHA256 в PowerShell.',
            '',
            'Файлы не подписаны. Успешная сборка Actions не гарантирует отсутствие срабатываний антивируса.',
            'CleanPause.msix — неподписанный предварительный пакет. Для Store нужны Identity из Partner Center, согласование allowElevation и проверка повышения прав, восстановления ввода и автозапуска. Пакет ещё не прошёл сертификацию Store; без подписи обычная установка двойным щелчком недоступна.'
          )
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "CleanPause $tag" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          } else {
            gh release edit $tag --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed.' }
          }
          gh release upload $tag dist/CleanPause.exe dist/CleanPause-Setup.exe dist/CleanPause.msix dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
